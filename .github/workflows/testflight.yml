name: TestFlight

# Builds a signed Release archive on a GitHub Mac and uploads it to App Store
# Connect, so a build can go to TestFlight from a Windows PC:
#
#   gh workflow run TestFlight
#
# Secrets stay secret in a public repo: they're never passed to workflows
# triggered from forks, and this workflow only runs by hand.
#
# Same three repository secrets as DeckMemo (the same App Store Connect API
# key works for every app on the team; add them to this repo too):
#   ASC_KEY_ID      the key's 10-character ID
#   ASC_ISSUER_ID   the issuer ID shown above the key list
#   ASC_KEY_P8      the whole downloaded .p8 file, including BEGIN/END lines
#
# The upload contains no game assets: the creature pack is copied onto the
# phone separately (see TESTFLIGHT.md). Keep testers INTERNAL (App Store
# Connect team members); external testing would send the build to review.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank uses this run's number)"
        required: false
        type: string

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ARCHIVE: ${{ github.workspace }}/build/TallGrass.xcarchive
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build the battle engine
        working-directory: BattleEngine
        run: |
          npm ci
          npm test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the API key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then
            echo "Missing ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 — see the comment at the top of this file." >&2
            exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Set the build number
        run: |
          BUILD="${{ inputs.build_number }}"
          if [ -z "$BUILD" ]; then BUILD="${{ github.run_number }}"; fi
          # App Store Connect rejects a build number that isn't higher than the last.
          sed -i '' -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project TallGrass.xcodeproj \
            -scheme TallGrass \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>628KBJ4UMU</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys
